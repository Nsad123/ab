name: Build Android Library (AAR) for CppEditor

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from (e.g. cppeditor-only or sa)'
        required: true
        default: 'cppeditor-only'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create minimal Android Library project
        run: |
          mkdir -p library/src/main/java
          cp -r app/src/main/java/com library/src/main/java/

          cat > library/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.editor">
          </manifest>
          EOF
          
                    cat > library/build.gradle << 'EOF'
          plugins { id 'com.android.library' }
          android {
              namespace 'com.editor'
              compileSdk 34
              defaultConfig { minSdk 21; targetSdk 34 }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {}
          EOF
          
                    cat > settings.gradle << 'EOF'
          include ':library'
          EOF
          
                    cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

      - name: Download Gradle wrapper
        run: |
          curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew
          chmod +x gradlew
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          curl -L -o gradle/wrapper/gradle-wrapper.properties https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.properties

      - name: Build AAR
        run: ./gradlew :library:assembleRelease --no-daemon

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: CppEditor-AAR
          path: library/build/outputs/aar/library-release.aar
          retention-days: 30
