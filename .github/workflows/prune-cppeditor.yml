name: Prune to CppEditor Only

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'New branch name (recommended: cppeditor-only)'
        required: true
        default: 'cppeditor-only'

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create new branch
        run: |
          git checkout -b ${{ github.event.inputs.branch }}

      - name: Keep ONLY CppEditor + textwarrior engine (delete everything else)
        run: |
          set -e
          echo "=== Starting prune ==="

          KEEP=(
            "app/src/main/java/com/androlua/LuaEditor.java"
            "app/src/main/java/com/myopicmobile/textwarrior/android/"
            "app/src/main/java/com/myopicmobile/textwarrior/common/"
            ".github/workflows/"
            "README.md"
            ".gitignore"
            "LICENSE.txt"
          )

          mkdir -p /tmp/kept
          for item in "${KEEP[@]}"; do
            if [ -e "$item" ]; then
              mkdir -p "/tmp/kept/$(dirname "$item")"
              cp -r "$item" "/tmp/kept/$(dirname "$item")/"
              echo "KEEP: $item"
            fi
          done

          # Delete everything except .git
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} + 2>/dev/null || true

          # Restore kept files
          cp -r /tmp/kept/* . 2>/dev/null || true
          rm -rf /tmp/kept

          echo "=== Prune finished ==="
          echo "Remaining top-level items:"
          ls -la

      - name: Rename to CppEditor + switch to C++ (LanguageC) + make standalone
        run: |
          set -e
          echo "=== Adapting for C++ ==="

          # Rename file
          if [ -f "app/src/main/java/com/androlua/LuaEditor.java" ]; then
            mv "app/src/main/java/com/androlua/LuaEditor.java" "app/src/main/java/com/androlua/CppEditor.java"
            echo "Renamed LuaEditor.java → CppEditor.java"
          fi

          FILE="app/src/main/java/com/androlua/CppEditor.java"
          if [ -f "$FILE" ]; then
            # Change class name
            sed -i 's/public class LuaEditor extends FreeScrollingTextField/public class CppEditor extends FreeScrollingTextField/' "$FILE"
            sed -i 's/\bLuaEditor\b/CppEditor/g' "$FILE"

            # Switch default language from Lua to C/C++
            sed -i 's/Lexer.setLanguage(LanguageLua.getInstance());/Lexer.setLanguage(LanguageC.getInstance());/' "$FILE"

            # Remove all LuaApplication dependencies (make it standalone)
            sed -i '/LuaApplication/d' "$FILE"
            sed -i '/fontDir/d' "$FILE"
            sed -i '/libDir/d' "$FILE"

            # Remove font loading code that depended on LuaApplication
            sed -i '/File df = new File/,+3d' "$FILE" || true
            sed -i '/File bf = new File/,+3d' "$FILE" || true
            sed -i '/File tf = new File/,+3d' "$FILE" || true

            # Remove the commented AsyncTask that used LuaUtil
            sed -i '/new AsyncTask/,+25d' "$FILE" || true

            echo "CppEditor.java updated for C++ support and standalone use"
          fi

          # Global rename in case any other files reference it
          find . -name "*.java" -exec sed -i 's/\bLuaEditor\b/CppEditor/g' {} + 2>/dev/null || true

          echo "=== Adaptation complete ==="

      - name: Create clean README.md
        run: |
          cat > README.md << 'EOT'
          # CppEditor
          
          Standalone Android code editor widget (extracted from AndroLua_pro).
          
          ## What you get
          - `CppEditor` (full-featured editor View)
          - Complete `com.myopicmobile.textwarrior` engine (syntax highlighting, autocomplete, undo/redo, search, etc.)
          - Defaults to **C/C++** syntax (`LanguageC`)
          
          ## How to turn this into an Android Library (AAR)
          
          1. In Android Studio: **File → New → New Module → Android Library**
          2. Copy the folder `app/src/main/java/com/` into your library module's `src/main/java/`
          3. (Recommended) Rename the package from `com.androlua` to something like `com.cppeditor` (update imports if you do)
          4. In your library module's `build.gradle`:
             ```gradle
             android {
                 compileSdkVersion 34
                 defaultConfig {
                     minSdkVersion 21
                     targetSdkVersion 34
                 }
             }
             ```
          5. Build: `./gradlew :yourlibrary:assembleRelease`
          
          ## Basic usage (in your app)
          
          ```java
          CppEditor editor = new CppEditor(this);
          editor.setDark(true);                    // dark theme
          editor.setTextSize(16);
          editor.setText("// Your C++ code here\n#include <iostream>\n\nint main() {\n    std::cout << \"Hello\";\n}");
          editor.setWordWrap(true);
          
          // Optional: add extra autocomplete words
          editor.addNames(new String[]{"std", "vector", "cout", "endl", "printf", "nullptr"});
          
          setContentView(editor);
          ```
          
          ## Main methods
          
          - `setText(String)`
          - `getText()`, `getSelectedText()`
          - `undo()`, `redo()`
          - `search()`, `gotoLine()`, `findNext(String keyword)`
          - `setDark(boolean)`
          - Color customization: `setKeywordColor()`, `setStringColor()`, `setCommentColor()`, etc.
          - `addNames(String[])` and `addPackage(String, String[])` for custom autocomplete
          
          ## Notes
          - No Lua, no full AndroLua dependencies.
          - Works as a normal Android View.
          - For better C++ support you can edit `LanguageC.java` (add more keywords, operators, etc.).
          
          Originally from Nsad123/ab (fork of nirenr/AndroLua_pro). Pruned & adapted June 2026.
          EOT
          echo "README.md created"

      - name: Remove any leftover LuaEditor file
        run: |
          rm -f "app/src/main/java/com/androlua/LuaEditor.java" 2>/dev/null || true

      - name: Commit and push new branch
        run: |
          git add -A
          git commit -m "Prune: Keep only CppEditor + textwarrior engine. Renamed to CppEditor, switched to LanguageC for C/C++, removed LuaApplication dependency. Cleaned repo for standalone use." || echo "No changes to commit"
          git push origin ${{ github.event.inputs.branch }} --force

      - name: Done
        run: |
          echo "✅ Successfully created branch: ${{ github.event.inputs.branch }}"
          echo ""
          echo "Next steps:"
          echo "1. Switch to the new branch in your repo"
          echo "2. Use the sources to create an Android Library module (see README.md)"
          echo "3. CppEditor now uses C/C++ highlighting by default"
